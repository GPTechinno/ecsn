[package]
name = "ecsn-firmware"
description = "The ECSN node on an STM32H747I-DISCO: Ethernet, SDRAM, the node of `ecsn`"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
publish = false

# Its own workspace: built for thumbv7em-none-eabihf from this directory (see .cargo/config.toml).
[workspace]

[dependencies]
ecsn = { path = "../ecsn" }
bitcoin = { version = "0.32.8", default-features = false }
# floresta-chain without std (getfloresta/Floresta#1501, merged) and with its walks back along the
# chain that no longer hash headers (not upstream yet): the `perf-chain-walks` branch of the fork
floresta-chain = { git = "https://github.com/GPTechinno/Floresta", branch = "perf-chain-walks", default-features = false }
tracing = { version = "0.1", default-features = false }

embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h747xi-cm7", "time-driver-any", "exti", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "udp", "dns", "dhcpv4", "medium-ethernet"] }
embassy-futures = "0.1"
# the display's user interface: BLIT built without std (its widgets without std are not upstream):
# the `local/no-std` branch of the fork
blit = { git = "https://github.com/Georges760/blit", branch = "local/no-std" }
blit-gui = { git = "https://github.com/Georges760/blit", branch = "local/no-std" }
blit-cpu = { git = "https://github.com/Georges760/blit", branch = "local/no-std", default-features = false }
blit-text = { git = "https://github.com/Georges760/blit", branch = "local/no-std" }
blit-widget = { git = "https://github.com/Georges760/blit", branch = "local/no-std", default-features = false }
embedded-io-async = "0.7"
stm32-fmc = "0.4.0"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["tlsf"] }
static_cell = "2.1"

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[build-dependencies]
# renders the display's glyphs
fontdue = "0.9"

[profile.dev]
# unoptimised code is too slow and too large for the 1 MB flash bank of the Cortex-M7
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
incremental = false
lto = "fat"
opt-level = "s"
