[package]
name = "ecsn-firmware"
description = "The ECSN node on an STM32H747I-DISCO: Ethernet, SDRAM, the node of `ecsn`"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
publish = false

# Its own workspace: built for thumbv7em-none-eabihf from this directory (see .cargo/config.toml).
[workspace]

[dependencies]
ecsn = { path = "../ecsn" }
bitcoin = { version = "0.32.8", default-features = false }
# SHA-256's block compression through `bitcoin_hashes_sha256_compress` (see `src/main.rs`), which
# the emulator runs natively
bitcoin_hashes = { version = "0.14.101", default-features = false, features = ["sha256-extern"] }
# floresta-chain without std (getfloresta/Floresta#1501, merged), with its walks back along the
# chain and its header acceptance hashing each header once (not upstream yet): the
# `perf-header-sync` branch of the fork, on its `perf-chain-walks`
floresta-chain = { git = "https://github.com/GPTechinno/Floresta", branch = "perf-header-sync", default-features = false }
tracing = { version = "0.1", default-features = false }

embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h747xi-cm7", "time-driver-any", "exti", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "udp", "dns", "dhcpv4", "medium-ethernet"] }
embassy-futures = "0.1"
# up to 16 addresses from a DNS answer (a DNS seed gives 20 to 40), one by default
smoltcp = { version = "0.13", default-features = false, features = ["dns-max-result-count-16"] }
# the display's user interface: BLIT built without std, from upstream (not on crates.io: `blit`
# there is another crate)
blit = { git = "https://github.com/nicoburniske/blit", rev = "9013914897d3882cecd7053db5fdbdc341f1da83" }
blit-gui = { git = "https://github.com/nicoburniske/blit", rev = "9013914897d3882cecd7053db5fdbdc341f1da83" }
blit-cpu = { git = "https://github.com/nicoburniske/blit", rev = "9013914897d3882cecd7053db5fdbdc341f1da83", default-features = false }
blit-text = { git = "https://github.com/nicoburniske/blit", rev = "9013914897d3882cecd7053db5fdbdc341f1da83" }
blit-widget = { git = "https://github.com/nicoburniske/blit", rev = "9013914897d3882cecd7053db5fdbdc341f1da83", default-features = false }
embedded-io-async = "0.7"
stm32-fmc = "0.4.0"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["tlsf"] }
static_cell = "2.1"

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[build-dependencies]
# renders the display's glyphs
fontdue = "0.9"

[profile.dev]
# unoptimised code is too slow and too large for the 1 MB flash bank of the Cortex-M7
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
incremental = false
lto = "fat"
opt-level = "s"

# the v2 transport's ciphers: syncing from a bridge in v2, a quarter of the core at "s", 6 % at 3
[profile.release.package.chacha20-poly1305]
opt-level = 3

[patch.crates-io]
# bitcoin_hashes 0.14.101 with the `sha256-extern` feature, and the bitcoin-io 0.1.101 beside it in
# the same workspace (so that there is one `io::Write`): the `hashes-sha256-extern` branch of the
# fork of rust-bitcoin, from its `0.32.xxx`
bitcoin_hashes = { git = "https://github.com/GPTechinno/rust-bitcoin", branch = "hashes-sha256-extern" }
bitcoin-io = { git = "https://github.com/GPTechinno/rust-bitcoin", branch = "hashes-sha256-extern" }
# rustreexo 0.7.0 whose proofs are checked without copying their hashes nor reserving twice their
# nodes, which a mainnet block's proof does not fit in the heap without: the `proof-memory` branch
# of the fork, from its `v0.7.0`
rustreexo = { git = "https://github.com/GPTechinno/rustreexo", branch = "proof-memory" }
