[package]
name = "ecsn"
description = "Embedded Compact State Node: a Utreexo node over floresta-chain, for microcontrollers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# `Mempool::hold_unchecked`, for measurements of the mempool's memory (`ecsn-replay`)
unchecked = []

[dependencies]
bitcoin.workspace = true
floresta-chain.workspace = true
rustreexo.workspace = true
embedded-io-async.workspace = true
embassy-futures.workspace = true
bip324.workspace = true
# the v2 transport's key exchange: a context on the heap
secp256k1 = { version = "0.29", default-features = false, features = ["alloc"] }
tracing.workspace = true

[dev-dependencies]
# a script interpreter for the tests that check scripts
ecsn-consensus = { path = "../ecsn-consensus" }
# `floresta-chain` is also a `cdylib`, which links on the host only with `std`
floresta-chain = { workspace = true, features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "time", "test-util"] }
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
