[workspace]
resolver = "2"
members = ["ecsn", "ecsn-host", "ecsn-regtest"]
# The firmware targets thumbv7em-none-eabihf with its own profile, runner and lockfile (see
# firmware/.cargo/config.toml), so it is built from its own directory, outside of this host workspace.
# ecsn-emu-disco builds with the nightly Rust of BLIT, its window (see ecsn-emu-disco/rust-toolchain.toml).
exclude = ["firmware", "ecsn-emu-disco"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]

[workspace.dependencies]
bitcoin = { version = "0.32.8", default-features = false }
# `bitcoin/Floresta` on its branch `floresta-chain-no-std` (getfloresta/Floresta#1498)
floresta-chain = { path = "../bitcoin/Floresta/crates/floresta-chain", default-features = false }
rustreexo = { version = "=0.7.0", default-features = false }
embedded-io-async = "0.7"
tracing = { version = "0.1", default-features = false }

ecsn = { path = "ecsn" }
